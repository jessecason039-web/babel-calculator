<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أجور توصيل الظروف - بابل إكسبريس</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --dark: #0f172a;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-500: #64748b;
            --gray-600: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f1f5f9;
            margin: 0;
            padding: 20px 10px;
            color: var(--dark);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--dark);
        }

        .header p {
            margin: 4px 0 0;
            color: var(--gray-500);
            font-size: 14px;
        }

        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-label {
            font-weight: 700;
            font-size: 15px;
            color: var(--dark);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .db-status {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 13px 40px 13px 15px;
            border: 2px solid #0284c7;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #ffffff;
        }

        .search-input:focus {
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            font-size: 18px;
            color: var(--primary);
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            max-height: 350px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 6px;
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.15s;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #f0f9ff;
        }

        .suggestion-title {
            font-weight: 800;
            font-size: 15px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .suggestion-line1 {
            font-size: 13px;
            color: #475569;
            margin-bottom: 2px;
        }

        .suggestion-line2 {
            font-size: 12px;
            color: #94a3b8;
        }

        #map {
            height: 280px;
            border-radius: 10px;
            border: 1px solid var(--gray-200);
            margin-bottom: 15px;
            z-index: 1;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
            border: 1px solid #bae6fd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-600);
            margin-bottom: 5px;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .result-box {
            margin-top: 20px;
            padding: 18px 24px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .result-box.success {
            background: #ecfdf5;
            border: 2px solid #10b981;
            color: #065f46;
        }

        .result-box.loading {
            background: #f0f9ff;
            border: 1.5px solid #bae6fd;
            color: #0369a1;
            display: block;
        }

        .result-box.error {
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #991b1b;
        }

        .price-highlight {
            font-size: 28px;
            font-weight: 800;
            color: #047857;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-sub {
            font-size: 13px;
            color: #059669;
            margin-top: 4px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✉️ حاسبة أجور توصيل الظروف (Envelope)</h1>
        <p>نظام استعلام أجور التوصيل الصافية لعنوان الزبون (بابل إكسبريس)</p>
    </div>

    <!-- 1. شريط البحث الشامل -->
    <div class="search-container">
        <div class="search-label">
            <span>إيجاد حي أو شارع من الخريطة:</span>
            <span id="dbStatus" class="db-status">⏳ جاري الاتصال...</span>
        </div>
        <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="liveSearchInput" class="search-input" placeholder="اكتب اسم الحي، الشارع، المعلم، أو المحافظة (مثال: قنيطرة، شارع بغداد، الفرقان)..." autocomplete="off">
        </div>
        <div id="suggestionsBox" class="suggestions-list"></div>
    </div>

    <!-- 2. الخريطة التفاعلية -->
    <div id="map"></div>

    <div>
        <label>الموقع المعتمد حالياً:</label>
        <div id="selectedBadge" class="badge-status">لم يتم تحديد موقع بعد</div>
    </div>

    <!-- 3. القوائم المنسدلة الثلاثة -->
    <div style="font-weight: 700; color: var(--primary); margin-bottom: 8px;">📋 التقسيم الجغرافي المعتمد:</div>
    <div class="grid">
        <div>
            <label>1. المحافظة / المدينة:</label>
            <select id="citySelect" onchange="onCityChange()">
                <option value="">-- اختر المدينة --</option>
            </select>
        </div>
        <div>
            <label>2. المنطقة الإدارية:</label>
            <select id="areaSelect" onchange="onAreaChange()" disabled>
                <option value="">-- اختر المنطقة --</option>
            </select>
        </div>
        <div>
            <label>3. الحي / البلدة:</label>
            <select id="neighbourhoodSelect" onchange="onNeighbourhoodChange()" disabled>
                <option value="">-- اختر الحي --</option>
            </select>
        </div>
    </div>

    <!-- بطاقة النتيجة التلقائية الفورية -->
    <div id="resultBox" class="result-box"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let selectedNeighbourhoodId = null;
    let allNeighbourhoodsList = [];
    let citiesList = [];
    let searchDebounceTimer = null;

    async function api(action, data = {}) {
        const res = await fetch(`/api/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await res.json();
    }

    // ==========================================
    // 1. مزامنة قاعدة البيانات الذكية
    // ==========================================
    async function initLocationsDatabase() {
        const dbStatus = document.getElementById('dbStatus');
        loadCitiesFallback();

        try {
            const res = await fetch('/api/locations-tree');
            const data = await res.json();
            if (data.status === 'success' && data.data) {
                citiesList = data.data.cities || [];
                allNeighbourhoodsList = data.data.neighbourhoods || [];
                dbStatus.innerText = `✅ تم ربط ${allNeighbourhoodsList.length} منطقة وحي`;
                populateCitiesDropdown();
            } else {
                setTimeout(initLocationsDatabase, 3000);
            }
        } catch (err) {
            dbStatus.innerText = `✅ النظام متصل`;
        }
    }

    function populateCitiesDropdown() {
        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">-- اختر المدينة --</option>';
        citiesList.forEach(c => {
            citySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
    }

    // ==========================================
    // 2. معالجة النصوص وحساب نقاط الأولوية
    // ==========================================
    function normalizeAr(str) {
        if (!str) return '';
        return str.toString()
            .trim()
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/[إأآا]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/[\-\_\,\.]/g, ' ')
            .replace(/\s+/g, ' ');
    }

    function calculateRelevanceScore(itemName, cityName, areaName, query) {
        const nItem = normalizeAr(itemName);
        const nCity = normalizeAr(cityName);
        const nArea = normalizeAr(areaName);
        const nQuery = normalizeAr(query);
        const nQueryNoAl = nQuery.replace(/^ال/, '');
        const nItemNoAl = nItem.replace(/^ال/, '');

        if (nItem === nQuery || nItemNoAl === nQueryNoAl) return 1000;
        if (nItem.startsWith(nQuery) || nItemNoAl.startsWith(nQueryNoAl)) return 800;

        const words = nItem.split(' ');
        if (words.some(w => w === nQuery || w.replace(/^ال/, '') === nQueryNoAl)) return 600;

        if (nItem.includes(nQuery) || nItemNoAl.includes(nQueryNoAl)) return 400;
        if (nCity === nQuery || nArea === nQuery) return 300;
        if (nCity.includes(nQuery) || nArea.includes(nQuery)) return 200;

        const rootItem = nItemNoAl.replace(/[يوه]/g, '');
        const rootQuery = nQueryNoAl.replace(/[يوه]/g, '');
        if (rootQuery.length >= 3 && rootItem.length >= 3) {
            if (rootItem === rootQuery) return 100;
            if (rootItem.includes(rootQuery) || rootQuery.includes(rootItem)) return 50;
        }

        return 0;
    }

    // ==========================================
    // 3. البحث الهجين اللحظي (أحياء + شوارع)
    // ==========================================
    const searchInput = document.getElementById('liveSearchInput');
    const suggestionsBox = document.getElementById('suggestionsBox');

    searchInput.addEventListener('input', function() {
        clearTimeout(searchDebounceTimer);
        const query = this.value.trim();

        if (query.length < 2) {
            suggestionsBox.style.display = 'none';
            return;
        }

        searchDebounceTimer = setTimeout(async () => {
            let babelMatches = [];
            allNeighbourhoodsList.forEach(item => {
                const score = calculateRelevanceScore(item.name, item.cityName, item.areaName, query);
                if (score > 0) {
                    babelMatches.push({ ...item, score, type: 'babel' });
                }
            });

            babelMatches.sort((a, b) => b.score - a.score || a.name.length - b.name.length);

            let streetMatches = [];
            try {
                const osmRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=sy&q=${encodeURIComponent(query)}&addressdetails=1&limit=6&accept-language=ar`);
                const osmData = await osmRes.json();
                if (osmData && osmData.length > 0) {
                    osmData.forEach(item => {
                        const isRoad = item.class === 'highway' || item.type === 'road' || item.type === 'residential' || item.type === 'street';
                        const mainTitle = item.address.road || item.address.suburb || item.address.neighbourhood || item.name;
                        streetMatches.push({
                            title: mainTitle,
                            displayName: item.display_name,
                            lat: parseFloat(item.lat),
                            lon: parseFloat(item.lon),
                            isRoad: isRoad,
                            type: 'osm'
                        });
                    });
                }
            } catch (e) {}

            renderCombinedSuggestions(babelMatches, streetMatches);
        }, 180);
    });

    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

    function renderCombinedSuggestions(babelItems, streetItems) {
        suggestionsBox.innerHTML = '';
        let totalCount = 0;

        const topBabel = babelItems.filter(b => b.score >= 400);
        topBabel.forEach(item => {
            appendBabelItem(item);
            totalCount++;
        });

        streetItems.forEach(item => {
            appendStreetItem(item);
            totalCount++;
        });

        const remainingBabel = babelItems.filter(b => b.score < 400);
        remainingBabel.forEach(item => {
            appendBabelItem(item);
            totalCount++;
        });

        if (totalCount > 0) {
            suggestionsBox.style.display = 'block';
        } else {
            suggestionsBox.innerHTML = '<div class="suggestion-item" style="color:var(--gray-500); font-size:13px;">لا توجد نتائج مطابقة...</div>';
            suggestionsBox.style.display = 'block';
        }
    }

    function appendBabelItem(item) {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `
            <div class="suggestion-title">📍 ${item.name}</div>
            <div class="suggestion-line1">سوريا - ${item.cityName} - ${item.areaName} - ${item.name}</div>
            <div class="suggestion-line2">${item.name} - ${item.areaName} - ${item.cityName}</div>
        `;
        div.onclick = () => {
            selectBabelItem(item);
        };
        suggestionsBox.appendChild(div);
    }

    function appendStreetItem(item) {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `
            <div class="suggestion-title">🛣️ ${item.title} <span style="font-size:11px; font-weight:normal; color:#0284c7;">(شارع / معلم)</span></div>
            <div class="suggestion-line1">${item.displayName}</div>
        `;
        div.onclick = () => {
            selectStreetItem(item);
        };
        suggestionsBox.appendChild(div);
    }

    async function selectBabelItem(item) {
        searchInput.value = item.name;
        suggestionsBox.style.display = 'none';
        await applyLocationSelection(item.cityId, item.areaId, item.id, item.cityName, item.areaName, item.name, true);
    }

    async function selectStreetItem(item) {
        searchInput.value = item.title;
        suggestionsBox.style.display = 'none';
        setMarker(item.lat, item.lon, 15);
        await identifyAndSelectByCoords(item.lat, item.lon);
    }

    // ==========================================
    // 4. الخريطة والنقر المباشر
    // ==========================================
    const map = L.map('map').setView([34.8021, 38.9968], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;

    map.on('click', async (e) => {
        const { lat, lng } = e.latlng;
        setMarker(lat, lng);
        await identifyAndSelectByCoords(lat, lng);
    });

    function setMarker(lat, lng, zoomLevel = null) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        if (zoomLevel) map.setView([lat, lng], zoomLevel);
    }

    async function identifyAndSelectByCoords(lat, lng) {
        document.getElementById('selectedBadge').innerText = "⏳ جاري التعرف وتعبئة القوائم...";
        showLoadingPrice();

        try {
            const resCoords = await api('findNeighbourhoodByCoordinates', { coordinates: { lat, lng } });

            if (resCoords.status === 'success' && resCoords.neighbourhood) {
                const targetId = resCoords.neighbourhood.id;
                let match = allNeighbourhoodsList.find(n => n.id === targetId);

                if (!match) {
                    match = allNeighbourhoodsList.find(n => normalizeAr(n.name) === normalizeAr(resCoords.neighbourhood.name));
                }

                if (match) {
                    await applyLocationSelection(match.cityId, match.areaId, match.id, match.cityName, match.areaName, match.name, false);
                } else {
                    selectedNeighbourhoodId = targetId;
                    document.getElementById('selectedBadge').innerText = `✅ الحي المحدد: ${resCoords.neighbourhood.name}`;
                    await autoCalculateDeliveryFee(selectedNeighbourhoodId);
                }
            } else {
                handleOutOfCoverage();
            }
        } catch (err) {
            document.getElementById('selectedBadge').innerText = "❌ خطأ في الاتصال بالسيرفر";
            hidePriceBox();
        }
    }

    // ==========================================
    // 5. تعبئة القوائم الثلاثة وحساب السعر
    // ==========================================
    async function applyLocationSelection(cityId, areaId, neighbourhoodId, cityName, areaName, neighbourhoodName, moveMap = false) {
        selectedNeighbourhoodId = neighbourhoodId;

        const citySelect = document.getElementById('citySelect');
        citySelect.value = cityId;

        await populateAreasForCity(cityId);
        const areaSelect = document.getElementById('areaSelect');
        areaSelect.value = areaId;

        await populateNeighbourhoodsForArea(areaId);
        const nSelect = document.getElementById('neighbourhoodSelect');
        nSelect.value = neighbourhoodId;

        document.getElementById('selectedBadge').innerText = `✅ ${cityName} > ${areaName} > ${neighbourhoodName}`;

        if (moveMap) {
            focusMapOnText(`${neighbourhoodName} ${cityName} سوريا`);
        }

        await autoCalculateDeliveryFee(neighbourhoodId);
    }

    async function focusMapOnText(query) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=sy&q=${encodeURIComponent(query)}&limit=1`);
            const data = await res.json();
            if (data && data.length > 0) {
                setMarker(parseFloat(data[0].lat), parseFloat(data[0].lon), 14);
            }
        } catch (e) {}
    }

    function handleOutOfCoverage() {
        selectedNeighbourhoodId = null;
        document.getElementById('selectedBadge').innerText = "❌ هذه المنطقة خارج نطاق التغطية حالياً";
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = 'result-box error';
        resultBox.innerHTML = `❌ المنطقة المحددة خارج نطاق التغطية`;
    }

    // ==========================================
    // 6. القوائم المنسدلة اليدوية
    // ==========================================
    async function loadCitiesFallback() {
        const data = await api('getCities');
        if (data.cities) {
            citiesList = data.cities;
            populateCitiesDropdown();
        }
    }

    async function onCityChange() {
        hidePriceBox();
        const cityId = document.getElementById('citySelect').value;
        await populateAreasForCity(cityId);
    }

    async function populateAreasForCity(cityId) {
        const areaSelect = document.getElementById('areaSelect');
        const nSelect = document.getElementById('neighbourhoodSelect');
        areaSelect.innerHTML = '<option value="">-- اختر المنطقة --</option>';
        nSelect.innerHTML = '<option value="">-- اختر الحي --</option>';
        nSelect.disabled = true;

        if (!cityId) {
            areaSelect.disabled = true;
            return;
        }

        const data = await api('getAreas', { cityID: parseInt(cityId) });
        if (data.areas) {
            areaSelect.disabled = false;
            data.areas.forEach(a => {
                areaSelect.innerHTML += `<option value="${a.id}">${a.name}</option>`;
            });
        }
    }

    async function onAreaChange() {
        hidePriceBox();
        const areaId = document.getElementById('areaSelect').value;
        await populateNeighbourhoodsForArea(areaId);
    }

    async function populateNeighbourhoodsForArea(areaId) {
        const nSelect = document.getElementById('neighbourhoodSelect');
        nSelect.innerHTML = '<option value="">-- اختر الحي --</option>';

        if (!areaId) {
            nSelect.disabled = true;
            return;
        }

        const data = await api('getNeighbourhoods', { areaID: parseInt(areaId) });
        if (data.neighbourhoods) {
            nSelect.disabled = false;
            data.neighbourhoods.forEach(n => {
                nSelect.innerHTML += `<option value="${n.id}">${n.name}</option>`;
            });
        }
    }

    async function onNeighbourhoodChange() {
        const nSelect = document.getElementById('neighbourhoodSelect');
        if (nSelect.value) {
            selectedNeighbourhoodId = parseInt(nSelect.value);
            const name = nSelect.options[nSelect.selectedIndex].text;
            document.getElementById('selectedBadge').innerText = `✅ تم الاختيار يدوياً: ${name}`;
            await autoCalculateDeliveryFee(selectedNeighbourhoodId);
        }
    }

    // ==========================================
    // 7. حساب أجور توصيل الظرف حصراً (Envelope Dropoff Only)
    // ==========================================
    async function autoCalculateDeliveryFee(neighbourhoodId) {
        const resultBox = document.getElementById('resultBox');
        showLoadingPrice();

        // إرسال نوع الشحنة كـ ظرف حصراً بوزن 1 كغ
        const payload = {
            delivery: {
                receiver: {
                    neighbourhood: { id: parseInt(neighbourhoodId) }
                },
                type: "envelope",
                parts: [{ weight: 1 }],
                deliveryType: "address",
                payer: "receiver"
            }
        };

        try {
            const data = await api('calculatePrice', payload);
            if (data.status === 'success') {
                // استخراج أجرة توصيل الظرف للعنوان حصراً (Dropoff)
                const deliveryFee = data.details && data.details.dropoff !== undefined ? data.details.dropoff : 0;

                resultBox.className = 'result-box success';
                resultBox.innerHTML = `
                    <div style="font-size: 14px; font-weight: 700; color: #065f46; margin-bottom: 4px;">✉️ أجور توصيل الظرف إلى عنوان الزبون:</div>
                    <div class="price-highlight">
                        ${deliveryFee.toLocaleString()} <span style="font-size: 18px;">${data.currency}</span>
                    </div>
                    <div class="price-sub">
                        (أجرة التوصيل للعنوان فقط - شحنة ظرف حصراً)
                    </div>
                `;
            } else {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `❌ ${data.errorMessage || 'المنطقة غير مدعومة حالياً'}`;
            }
        } catch (err) {
            resultBox.className = 'result-box error';
            resultBox.innerHTML = '❌ فشل احتساب أجرة التوصيل';
        }
    }

    function showLoadingPrice() {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = 'result-box loading';
        resultBox.innerHTML = '⏳ جاري جلب أجرة توصيل الظرف...';
    }

    function hidePriceBox() {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';
    }

    initLocationsDatabase();
</script>
</body>
</html>
