<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أجور التوصيل - بابل إكسبريس</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --dark: #0f172a;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-500: #64748b;
            --gray-600: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f1f5f9;
            margin: 0;
            padding: 20px 10px;
            color: var(--dark);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--dark);
        }

        .header p {
            margin: 4px 0 0;
            color: var(--gray-500);
            font-size: 14px;
        }

        /* حاوية البحث اللحظي التفاعلي */
        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-label {
            font-weight: 700;
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 6px;
            display: block;
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #bae6fd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #f0f9ff;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            font-size: 18px;
            color: var(--primary);
        }

        /* قائمة الاقتراحات المنبثقة */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 6px;
            display: none;
        }

        .suggestion-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.15s;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #f0f9ff;
        }

        .suggestion-title {
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .suggestion-subtitle {
            font-size: 12px;
            color: var(--gray-500);
            line-height: 1.4;
        }

        /* الخريطة */
        #map {
            height: 280px;
            border-radius: 10px;
            border: 1px solid var(--gray-200);
            margin-bottom: 15px;
            z-index: 1;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
            border: 1px solid #bae6fd;
        }

        /* القوائم المنسدلة */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-600);
            margin-bottom: 5px;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* بطاقة النتيجة التلقائية */
        .result-box {
            margin-top: 20px;
            padding: 18px 24px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .result-box.success {
            background: #ecfdf5;
            border: 2px solid #10b981;
            color: #065f46;
        }

        .result-box.loading {
            background: #f0f9ff;
            border: 1.5px solid #bae6fd;
            color: #0369a1;
            display: block;
        }

        .result-box.error {
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #991b1b;
        }

        .price-highlight {
            font-size: 26px;
            font-weight: 800;
            color: #047857;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛵 حاسبة أجور التوصيل للزبون</h1>
        <p>نظام الاستعلام التلقائي والمباشر لمسؤولي المبيعات (بابل إكسبريس)</p>
    </div>

    <!-- 1. شريط البحث اللحظي التفاعلي -->
    <div class="search-container">
        <label class="search-label">🔍 إيجاد حي / منطقة من الخريطة بالبحث اللحظي:</label>
        <div class="search-input-wrap">
            <span class="search-icon">📍</span>
            <input type="text" id="liveSearchInput" class="search-input" placeholder="اكتب اسم الحي، المدينة، أو البلدة (مثال: طرطوس، قنيطرة، الفرقان)..." autocomplete="off">
        </div>
        <!-- قائمة الاقتراحات المنبثقة -->
        <div id="suggestionsBox" class="suggestions-list"></div>
    </div>

    <!-- 2. الخريطة التفاعلية -->
    <div id="map"></div>

    <div>
        <label>الموقع المعتمد حالياً:</label>
        <div id="selectedBadge" class="badge-status">لم يتم تحديد موقع بعد</div>
    </div>

    <!-- 3. القوائم المنسدلة الثلاثة (تتعبأ تلقائياً) -->
    <div style="font-weight: 700; color: var(--primary); margin-bottom: 8px;">📋 التقسيم الجغرافي:</div>
    <div class="grid">
        <div>
            <label>1. المحافظة / المدينة:</label>
            <select id="citySelect" onchange="onCityChange()">
                <option value="">-- اختر المدينة --</option>
            </select>
        </div>
        <div>
            <label>2. المنطقة الإدارية:</label>
            <select id="areaSelect" onchange="onAreaChange()" disabled>
                <option value="">-- اختر المنطقة --</option>
            </select>
        </div>
        <div>
            <label>3. الحي / البلدة:</label>
            <select id="neighbourhoodSelect" onchange="onNeighbourhoodChange()" disabled>
                <option value="">-- اختر الحي --</option>
            </select>
        </div>
    </div>

    <!-- بطاقة النتيجة التلقائية الفورية -->
    <div id="resultBox" class="result-box"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let selectedNeighbourhoodId = null;
    let searchDebounceTimer = null;
    let citiesList = [];

    // الاتصال مع السيرفر
    async function api(action, data = {}) {
        const res = await fetch(`/api/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await res.json();
    }

    // ==========================================
    // 1. إعداد الخريطة
    // ==========================================
    const map = L.map('map').setView([34.8021, 38.9968], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;

    // النقر المباشر على الخريطة
    map.on('click', async (e) => {
        const { lat, lng } = e.latlng;
        setMarker(lat, lng);
        await identifyAndAutoSelectByCoords(lat, lng);
    });

    function setMarker(lat, lng, zoomLevel = null) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        if (zoomLevel) {
            map.setView([lat, lng], zoomLevel);
        }
    }

    // ==========================================
    // 2. البحث اللحظي وقائمة الاقتراحات (Autocomplete)
    // ==========================================
    const searchInput = document.getElementById('liveSearchInput');
    const suggestionsBox = document.getElementById('suggestionsBox');

    searchInput.addEventListener('input', function() {
        clearTimeout(searchDebounceTimer);
        const query = this.value.trim();

        if (query.length < 2) {
            suggestionsBox.style.display = 'none';
            return;
        }

        searchDebounceTimer = setTimeout(() => {
            fetchLiveSuggestions(query);
        }, 250);
    });

    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

    async function fetchLiveSuggestions(query) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=sy&q=${encodeURIComponent(query)}&addressdetails=1&limit=6&accept-language=ar`);
            const data = await res.json();

            suggestionsBox.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(item => {
                    const mainTitle = item.address.suburb || item.address.neighbourhood || item.address.quarter || item.address.village || item.address.town || item.address.city || item.name;
                    const subTitle = item.display_name;

                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `
                        <div class="suggestion-title">${mainTitle}</div>
                        <div class="suggestion-subtitle">${subTitle}</div>
                    `;
                    div.onclick = () => {
                        selectSuggestionItem(item, mainTitle);
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.innerHTML = '<div class="suggestion-item" style="color:var(--gray-500); font-size:13px;">لا توجد نتائج مطابقة...</div>';
                suggestionsBox.style.display = 'block';
            }
        } catch (err) {
            console.error("خطأ في جلب الاقتراحات", err);
        }
    }

    async function selectSuggestionItem(item, mainTitle) {
        searchInput.value = mainTitle;
        suggestionsBox.style.display = 'none';
        
        const lat = parseFloat(item.lat);
        const lng = parseFloat(item.lon);
        setMarker(lat, lng, 14);

        await identifyAndAutoSelectByCoords(lat, lng, item.display_name);
    }

    // ==========================================
    // 3. التعرف الدقيق على المحافظة والحي (منع التداخل)
    // ==========================================
    async function identifyAndAutoSelectByCoords(lat, lng, fallbackFullName = "") {
        document.getElementById('selectedBadge').innerText = "⏳ جاري التعرف ومطابقة المنطقة بدقة...";
        showLoadingPrice();

        try {
            let detectedCity = "";
            let detectedPlace = "";

            // أ) جلب اسم المحافظة الجغرافية الحقيقية من الخريطة (طرطوس، حمص، دمشق...)
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar&addressdetails=1`);
                const geoData = await geoRes.json();
                if (geoData && geoData.address) {
                    const addr = geoData.address;
                    detectedCity = addr.state || addr.province || addr.city || addr.governorate || "";
                    detectedCity = detectedCity.replace("محافظة", "").trim();
                    detectedPlace = addr.suburb || addr.neighbourhood || addr.quarter || addr.village || addr.town || addr.city || "";
                }
            } catch (e) {
                console.log("Geo reverse lookup error", e);
            }

            // ب) فحص إحداثيات بابل إكسبريس
            const resCoords = await api('findNeighbourhoodByCoordinates', { coordinates: { lat, lng } });
            let nName = (resCoords.status === 'success' && resCoords.neighbourhood) ? resCoords.neighbourhood.name : detectedPlace;
            let nId = (resCoords.status === 'success' && resCoords.neighbourhood) ? resCoords.neighbourhood.id : null;

            // ج) بناء نص بحث دقيق يحتوي على اسم المحافظة (مثال: "طرطوس الكورنيش")
            let searchAddressText = "";
            if (detectedCity && nName) {
                searchAddressText = `${detectedCity} ${nName}`;
            } else if (fallbackFullName) {
                searchAddressText = fallbackFullName;
            } else {
                searchAddressText = nName;
            }

            // د) مطابقة العنوان الدقيق
            const resAddress = await api('findNeighbourhoodByAddress', { address: searchAddressText });
            
            if (resAddress.status === 'success' && resAddress.city && resAddress.area && resAddress.neighbourhood) {
                selectedNeighbourhoodId = resAddress.neighbourhood.id;
                await populateDropdownsCascade(resAddress.city.id, resAddress.area.id, resAddress.neighbourhood.id);
                document.getElementById('selectedBadge').innerText = `✅ ${resAddress.city.name} > ${resAddress.area.name} > ${resAddress.neighbourhood.name}`;
                await autoCalculateDeliveryFee(selectedNeighbourhoodId);
            } else if (nId) {
                // إذا لم تنجح المطابقة النصية، نعتمد حي بابل المباشر
                selectedNeighbourhoodId = nId;
                document.getElementById('selectedBadge').innerText = `✅ الحي المحدد: ${nName}`;
                await autoCalculateDeliveryFee(selectedNeighbourhoodId);
            } else {
                handleOutOfCoverage();
            }
        } catch (err) {
            document.getElementById('selectedBadge').innerText = "❌ خطأ في الاتصال بالسيرفر";
            hidePriceBox();
        }
    }

    function handleOutOfCoverage() {
        selectedNeighbourhoodId = null;
        document.getElementById('selectedBadge').innerText = "❌ هذه المنطقة خارج نطاق التغطية حالياً";
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = 'result-box error';
        resultBox.innerHTML = `❌ المنطقة المحددة خارج نطاق التغطية`;
    }

    async function populateDropdownsCascade(cityId, areaId, neighbourhoodId) {
        const citySelect = document.getElementById('citySelect');
        citySelect.value = cityId;

        await loadAreasForCity(cityId);
        const areaSelect = document.getElementById('areaSelect');
        areaSelect.value = areaId;

        await loadNeighbourhoodsForArea(areaId);
        const nSelect = document.getElementById('neighbourhoodSelect');
        nSelect.value = neighbourhoodId;
    }

    // ==========================================
    // 4. القوائم المنسدلة اليدوية
    // ==========================================
    async function loadCities() {
        try {
            const data = await api('getCities');
            const citySelect = document.getElementById('citySelect');
            citySelect.innerHTML = '<option value="">-- اختر المدينة --</option>';
            if (data.cities) {
                citiesList = data.cities;
                data.cities.forEach(c => {
                    citySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
            }
        } catch (err) {
            console.error("فشل جلب المدن", err);
        }
    }

    async function onCityChange() {
        hidePriceBox();
        const cityId = document.getElementById('citySelect').value;
        await loadAreasForCity(cityId);
    }

    async function loadAreasForCity(cityId) {
        const areaSelect = document.getElementById('areaSelect');
        const nSelect = document.getElementById('neighbourhoodSelect');
        areaSelect.innerHTML = '<option value="">-- اختر المنطقة --</option>';
        nSelect.innerHTML = '<option value="">-- اختر الحي --</option>';
        nSelect.disabled = true;

        if (!cityId) {
            areaSelect.disabled = true;
            return;
        }

        const data = await api('getAreas', { cityID: parseInt(cityId) });
        if (data.areas) {
            areaSelect.disabled = false;
            data.areas.forEach(a => {
                areaSelect.innerHTML += `<option value="${a.id}">${a.name}</option>`;
            });
        }
    }

    async function onAreaChange() {
        hidePriceBox();
        const areaId = document.getElementById('areaSelect').value;
        await loadNeighbourhoodsForArea(areaId);
    }

    async function loadNeighbourhoodsForArea(areaId) {
        const nSelect = document.getElementById('neighbourhoodSelect');
        nSelect.innerHTML = '<option value="">-- اختر الحي --</option>';

        if (!areaId) {
            nSelect.disabled = true;
            return;
        }

        const data = await api('getNeighbourhoods', { areaID: parseInt(areaId) });
        if (data.neighbourhoods) {
            nSelect.disabled = false;
            data.neighbourhoods.forEach(n => {
                nSelect.innerHTML += `<option value="${n.id}">${n.name}</option>`;
            });
        }
    }

    async function onNeighbourhoodChange() {
        const nSelect = document.getElementById('neighbourhoodSelect');
        if (nSelect.value) {
            selectedNeighbourhoodId = parseInt(nSelect.value);
            const name = nSelect.options[nSelect.selectedIndex].text;
            document.getElementById('selectedBadge').innerText = `✅ تم الاختيار يدوياً: ${name}`;
            await autoCalculateDeliveryFee(selectedNeighbourhoodId);
        }
    }

    // ==========================================
    // 5. الحساب التلقائي لأجور التوصيل للعنوان (Dropoff)
    // ==========================================
    async function autoCalculateDeliveryFee(neighbourhoodId) {
        const resultBox = document.getElementById('resultBox');
        showLoadingPrice();

        const payload = {
            delivery: {
                receiver: {
                    neighbourhood: { id: parseInt(neighbourhoodId) }
                },
                type: "box",
                parts: [{ weight: 1 }],
                deliveryType: "address",
                payer: "receiver"
            }
        };

        try {
            const data = await api('calculatePrice', payload);
            if (data.status === 'success') {
                const deliveryFee = data.details && data.details.dropoff !== undefined ? data.details.dropoff : 0;

                resultBox.className = 'result-box success';
                resultBox.innerHTML = `
                    <div style="font-size: 14px; font-weight: 700; color: #065f46; margin-bottom: 4px;">🛵 أجور التوصيل إلى عنوان الزبون:</div>
                    <div class="price-highlight">
                        ${deliveryFee.toLocaleString()} <span style="font-size: 18px;">${data.currency}</span>
                    </div>
                `;
            } else {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `❌ ${data.errorMessage || 'المنطقة غير مدعومة حالياً'}`;
            }
        } catch (err) {
            resultBox.className = 'result-box error';
            resultBox.innerHTML = '❌ فشل احتساب أجرة التوصيل';
        }
    }

    function showLoadingPrice() {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = 'result-box loading';
        resultBox.innerHTML = '⏳ جاري جلب أجرة التوصيل للعنوان...';
    }

    function hidePriceBox() {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';
    }

    loadCities();
</script>
</body>
</html>
