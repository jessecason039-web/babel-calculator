<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أجور التوصيل - بابل إكسبريس</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --dark: #0f172a;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-500: #64748b;
            --gray-600: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f1f5f9;
            margin: 0;
            padding: 20px 10px;
            color: var(--dark);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--dark);
        }

        .header p {
            margin: 4px 0 0;
            color: var(--gray-500);
            font-size: 14px;
        }

        /* حاوية البحث اللحظي */
        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-label {
            font-weight: 700;
            font-size: 15px;
            color: var(--dark);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .db-status {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 13px 40px 13px 15px;
            border: 2px solid #0284c7;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
            background: #ffffff;
        }

        .search-input:focus {
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            font-size: 18px;
            color: var(--primary);
        }

        /* قائمة الاقتراحات الشاملة المطابقة للصور */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            max-height: 340px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 6px;
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.15s;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #f0f9ff;
        }

        .suggestion-title {
            font-weight: 800;
            font-size: 16px;
            color: #0f172a;
            margin-bottom: 3px;
        }

        .suggestion-line1 {
            font-size: 13px;
            color: #475569;
            margin-bottom: 2px;
        }

        .suggestion-line2 {
            font-size: 12px;
            color: #94a3b8;
        }

        /* الخريطة */
        #map {
            height: 280px;
            border-radius: 10px;
            border: 1px solid var(--gray-200);
            margin-bottom: 15px;
            z-index: 1;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
            border: 1px solid #bae6fd;
        }

        /* القوائم المنسدلة */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-600);
            margin-bottom: 5px;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* بطاقة النتيجة التلقائية */
        .result-box {
            margin-top: 20px;
            padding: 18px 24px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .result-box.success {
            background: #ecfdf5;
            border: 2px solid #10b981;
            color: #065f46;
        }

        .result-box.loading {
            background: #f0f9ff;
            border: 1.5px solid #bae6fd;
            color: #0369a1;
            display: block;
        }

        .result-box.error {
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #991b1b;
        }

        .price-highlight {
            font-size: 26px;
            font-weight: 800;
            color: #047857;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛵 حاسبة أجور التوصيل للزبون</h1>
        <p>نظام الاستعلام التلقائي والمباشر لمسؤولي المبيعات (بابل إكسبريس)</p>
    </div>

    <!-- 1. شريط البحث اللحظي الشامل -->
    <div class="search-container">
        <div class="search-label">
            <span>إيجاد حي من الخريطة</span>
            <span id="dbStatus" class="db-status">⏳ جاري مزامنة قاعدة البيانات...</span>
        </div>
        <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="liveSearchInput" class="search-input" placeholder="اكتب اسم الحي أو البلدة أو المحافظة (مثال: قنيطرة، الميدان، الفرقان)..." autocomplete="off">
        </div>
        <!-- قائمة الاقتراحات الشاملة -->
        <div id="suggestionsBox" class="suggestions-list"></div>
    </div>

    <!-- 2. الخريطة التفاعلية -->
    <div id="map"></div>

    <div>
        <label>الموقع المعتمد حالياً:</label>
        <div id="selectedBadge" class="badge-status">لم يتم تحديد موقع بعد</div>
    </div>

    <!-- 3. القوائم المنسدلة الثلاثة -->
    <div style="font-weight: 700; color: var(--primary); margin-bottom: 8px;">📋 التقسيم الجغرافي المعتمد:</div>
    <div class="grid">
        <div>
            <label>1. المحافظة / المدينة:</label>
            <select id="citySelect" onchange="onCityChange()">
                <option value="">-- اختر المدينة --</option>
            </select>
        </div>
        <div>
            <label>2. المنطقة الإدارية:</label>
            <select id="areaSelect" onchange="onAreaChange()" disabled>
                <option value="">-- اختر المنطقة --</option>
            </select>
        </div>
        <div>
            <label>3. الحي / البلدة:</label>
            <select id="neighbourhoodSelect" onchange="onNeighbourhoodChange()" disabled>
                <option value="">-- اختر الحي --</option>
            </select>
        </div>
    </div>

    <!-- بطاقة النتيجة التلقائية الفورية -->
    <div id="resultBox" class="result-box"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let selectedNeighbourhoodId = null;
    let allNeighbourhoodsList = [];
    let citiesList = [];

    // الاتصال مع السيرفر
    async function api(action, data = {}) {
        const res = await fetch(`/api/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await res.json();
    }

    // ==========================================
    // 1. تحميل قاعدة بيانات مناطق سوريا بالكامل
    // ==========================================
    async function initLocationsDatabase() {
        const dbStatus = document.getElementById('dbStatus');
        try {
            const res = await fetch('/api/locations-tree');
            const data = await res.json();
            if (data.status === 'success' && data.data) {
                citiesList = data.data.cities || [];
                allNeighbourhoodsList = data.data.neighbourhoods || [];
                dbStatus.innerText = `✅ تم تحميل ${allNeighbourhoodsList.length} منطقة وحي`;
                populateCitiesDropdown();
            }
        } catch (err) {
            dbStatus.innerText = `⚠️ تحديث البيانات نشط`;
            loadCitiesFallback();
        }
    }

    function populateCitiesDropdown() {
        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">-- اختر المدينة --</option>';
        citiesList.forEach(c => {
            citySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
    }

    // ==========================================
    // 2. محرك البحث الذكي والمطابقة التقريبية (Fuzzy Search)
    // ==========================================
    function normalizeArabic(text) {
        if (!text) return "";
        return text
            .toString()
            .trim()
            .replace(/[\u064B-\u065F]/g, '') // إزالة التشكيل
            .replace(/[إأآا]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/^ال/, ''); // معالجة ال التعريف
    }

    // مطابقة تقريبية مرنة للبحث الشامل
    function isMatch(text, query) {
        const normText = normalizeArabic(text);
        const normQuery = normalizeArabic(query);
        if (normText.includes(normQuery) || normQuery.includes(normText)) return true;

        // مطابقة الجذور (مثل قنيطرة مع قنطرة)
        const rootText = normText.replace(/[يوه]/g, '');
        const rootQuery = normQuery.replace(/[يوه]/g, '');
        if (rootText.length >= 3 && rootQuery.length >= 3) {
            if (rootText.includes(rootQuery) || rootQuery.includes(rootText)) return true;
        }
        return false;
    }

    const searchInput = document.getElementById('liveSearchInput');
    const suggestionsBox = document.getElementById('suggestionsBox');

    searchInput.addEventListener('input', function() {
        const query = this.value.trim();

        if (query.length < 2) {
            suggestionsBox.style.display = 'none';
            return;
        }

        // تصفية جميع النتائج من قاعدة البيانات المطابقة لشجرة بابل إكسبريس
        const matches = allNeighbourhoodsList.filter(item => {
            return isMatch(item.name, query) || isMatch(item.cityName, query) || isMatch(item.areaName, query);
        });

        renderSuggestions(matches);
    });

    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

    function renderSuggestions(items) {
        suggestionsBox.innerHTML = '';
        if (items && items.length > 0) {
            items.slice(0, 40).forEach(item => { // عرض حتى 40 نتيجة شاملة
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `
                    <div class="suggestion-title">${item.name}</div>
                    <div class="suggestion-line1">سوريا - ${item.cityName} - ${item.areaName} - ${item.name}</div>
                    <div class="suggestion-line2">${item.name} - ${item.areaName} - ${item.cityName}</div>
                `;
                div.onclick = () => {
                    selectSuggestion(item);
                };
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        } else {
            suggestionsBox.innerHTML = '<div class="suggestion-item" style="color:var(--gray-500); font-size:13px;">لا توجد مناطق مطابقة...</div>';
            suggestionsBox.style.display = 'block';
        }
    }

    // عند اختيار أي منطقة من القائمة الشاملة
    async function selectSuggestion(item) {
        searchInput.value = item.name;
        suggestionsBox.style.display = 'none';

        // 1. تعبئة القوائم الثلاثة فوراً وبدقة تامة
        await populateDropdownsCascade(item.cityId, item.areaId, item.id);
        document.getElementById('selectedBadge').innerText = `✅ ${item.cityName} > ${item.areaName} > ${item.name}`;

        // 2. تحريك الخريطة إلى النقطة بدقة
        focusMapOnLocation(`${item.name} ${item.cityName} سوريا`);

        // 3. حساب أجرة التوصيل فوراً
        selectedNeighbourhoodId = item.id;
        await autoCalculateDeliveryFee(selectedNeighbourhoodId);
    }

    // نقل الخريطة للموقع المختار
    async function focusMapOnLocation(query) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=sy&q=${encodeURIComponent(query)}&limit=1`);
            const data = await res.json();
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                setMarker(lat, lon, 14);
            }
        } catch (e) {}
    }

    // ==========================================
    // 3. إعداد الخريطة والنقر المباشر
    // ==========================================
    const map = L.map('map').setView([34.8021, 38.9968], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;

    map.on('click', async (e) => {
        const { lat, lng } = e.latlng;
        setMarker(lat, lng);
        await identifyByCoordinates(lat, lng);
    });

    function setMarker(lat, lng, zoomLevel = null) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        if (zoomLevel) map.setView([lat, lng], zoomLevel);
    }

    async function identifyByCoordinates(lat, lng) {
        document.getElementById('selectedBadge').innerText = "⏳ جاري التعرف ومطابقة المنطقة...";
        showLoadingPrice();

        try {
            const resCoords = await api('findNeighbourhoodByCoordinates', { coordinates: { lat, lng } });
            if (resCoords.status === 'success' && resCoords.neighbourhood) {
                const matchedNeighbourhood = allNeighbourhoodsList.find(n => n.id === resCoords.neighbourhood.id);
                if (matchedNeighbourhood) {
                    await selectSuggestion(matchedNeighbourhood);
                } else {
                    selectedNeighbourhoodId = resCoords.neighbourhood.id;
                    document.getElementById('selectedBadge').innerText = `✅ الحي المحدد: ${resCoords.neighbourhood.name}`;
                    await autoCalculateDeliveryFee(selectedNeighbourhoodId);
                }
            } else {
                handleOutOfCoverage();
            }
        } catch (err) {
            document.getElementById('selectedBadge').innerText = "❌ خطأ في الاتصال بالسيرفر";
            hidePriceBox();
        }
    }

    function handleOutOfCoverage() {
        selectedNeighbourhoodId = null;
        document.getElementById('selectedBadge').innerText = "❌ هذه المنطقة خارج نطاق التغطية حالياً";
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = 'result-box error';
        resultBox.innerHTML = `❌ المنطقة المحددة خارج نطاق التغطية`;
    }

    async function populateDropdownsCascade(cityId, areaId, neighbourhoodId) {
        const citySelect = document.getElementById('citySelect');
        citySelect.value = cityId;

        await loadAreasForCity(cityId);
        const areaSelect = document.getElementById('areaSelect');
        areaSelect.value = areaId;

        await loadNeighbourhoodsForArea(areaId);
        const nSelect = document.getElementById('neighbourhoodSelect');
        nSelect.value = neighbourhoodId;
    }

    // ==========================================
    // 4. القوائم المنسدلة اليدوية
    // ==========================================
    async function loadCitiesFallback() {
        const data = await api('getCities');
        if (data.cities) {
            citiesList = data.cities;
            populateCitiesDropdown();
        }
    }

    async function onCityChange() {
        hidePriceBox();
        const cityId = document.getElementById('citySelect').value;
        await loadAreasForCity(cityId);
    }

    async function loadAreasForCity(cityId) {
        const areaSelect = document.getElementById('areaSelect');
        const nSelect = document.getElementById('neighbourhoodSelect');
        areaSelect.innerHTML = '<option value="">-- اختر المنطقة --</option>';
        nSelect.innerHTML = '<option value="">-- اختر الحي --</option>';
        nSelect.disabled = true;

        if (!cityId) {
            areaSelect.disabled = true;
            return;
        }

        const data = await api('getAreas', { cityID: parseInt(cityId) });
        if (data.areas) {
            areaSelect.disabled = false;
            data.areas.forEach(a => {
                areaSelect.innerHTML += `<option value="${a.id}">${a.name}</option>`;
            });
        }
    }

    async function onAreaChange() {
        hidePriceBox();
        const areaId = document.getElementById('areaSelect').value;
        await loadNeighbourhoodsForArea(areaId);
    }

    async function loadNeighbourhoodsForArea(areaId) {
        const nSelect = document.getElementById('neighbourhoodSelect');
        nSelect.innerHTML = '<option value="">-- اختر الحي --</option>';

        if (!areaId) {
            nSelect.disabled = true;
            return;
        }

        const data = await api('getNeighbourhoods', { areaID: parseInt(areaId) });
        if (data.neighbourhoods) {
            nSelect.disabled = false;
            data.neighbourhoods.forEach(n => {
                nSelect.innerHTML += `<option value="${n.id}">${n.name}</option>`;
            });
        }
    }

    async function onNeighbourhoodChange() {
        const nSelect = document.getElementById('neighbourhoodSelect');
        if (nSelect.value) {
            selectedNeighbourhoodId = parseInt(nSelect.value);
            const name = nSelect.options[nSelect.selectedIndex].text;
            document.getElementById('selectedBadge').innerText = `✅ تم الاختيار يدوياً: ${name}`;
            await autoCalculateDeliveryFee(selectedNeighbourhoodId);
        }
    }

    // ==========================================
    // 5. حساب أجرة التوصيل الفورية (Dropoff)
    // ==========================================
    async function autoCalculateDeliveryFee(neighbourhoodId) {
        const resultBox = document.getElementById('resultBox');
        showLoadingPrice();

        const payload = {
            delivery: {
                receiver: {
                    neighbourhood: { id: parseInt(neighbourhoodId) }
                },
                type: "box",
                parts: [{ weight: 1 }],
                deliveryType: "address",
                payer: "receiver"
            }
        };

        try {
            const data = await api('calculatePrice', payload);
            if (data.status === 'success') {
                const deliveryFee = data.details && data.details.dropoff !== undefined ? data.details.dropoff : 0;

                resultBox.className = 'result-box success';
                resultBox.innerHTML = `
                    <div style="font-size: 14px; font-weight: 700; color: #065f46; margin-bottom: 4px;">🛵 أجور التوصيل إلى عنوان الزبون:</div>
                    <div class="price-highlight">
                        ${deliveryFee.toLocaleString()} <span style="font-size: 18px;">${data.currency}</span>
                    </div>
                `;
            } else {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `❌ ${data.errorMessage || 'المنطقة غير مدعومة حالياً'}`;
            }
        } catch (err) {
            resultBox.className = 'result-box error';
            resultBox.innerHTML = '❌ فشل احتساب أجرة التوصيل';
        }
    }

    function showLoadingPrice() {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = 'result-box loading';
        resultBox.innerHTML = '⏳ جاري جلب أجرة التوصيل للعنوان...';
    }

    function hidePriceBox() {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';
    }

    // بدء تشغيل وتحميل قاعدة البيانات
    initLocationsDatabase();
</script>
</body>
</html>
